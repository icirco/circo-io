bio:
  # First sentence, always visible
  first:
    en: "Julian Circo has spent his career at the intersection of social impact, entrepreneurship and technology."
    de: "Julian Circo bewegt sich seit jeher an der Schnittstelle von sozialer Wirkung, Unternehmertum und Technologie."
  # Paragraphs shown after clicking "Expand"
  rest:
    en:
      - "He started on the front lines of aid delivery, on humanitarian missions in places like East Timor, Cambodia and the DRC, then started up operations for a UN agency in Somalia and turned around large scale country operations for a global public health organization in Swaziland and Mozambique."
      - "He founded and built to scale Triggerise, a global social enterprise connecting people in underserved markets with health products and services, and co-founded Proof of Impact, a platform for verifying and financing impact."
      - "He also advised Intellectual Ventures, the Seattle-based IP and venture capital firm."
      - "In 2020 he co-founded Hyfe, an AI health tech company that turns cough into a digital biomarker, and has since taken it to scale. Hyfe is the global market leader in cough monitoring and has been used in 52+ clinical trials, including Phase 2 and 3 pharma trials."
      - "A human rights lawyer by training, he is based in Vienna."
    de:
      - "Seine Laufbahn begann an vorderster Front der humanitären Hilfe, mit Einsätzen unter anderem in Osttimor, Kambodscha und der DR Kongo. Danach baute er die Präsenz einer UN-Organisation in Somalia auf und stellte die großen Länderprogramme einer globalen Gesundheitsorganisation in Swasiland und Mosambik neu auf."
      - "Er gründete Triggerise und skalierte es zu einem globalen Sozialunternehmen, das Menschen in unterversorgten Märkten Zugang zu Gesundheitsleistungen verschafft. Zudem war er Mitgründer von Proof of Impact, einer Plattform zur Verifizierung und Finanzierung von Wirkung."
      - "Darüber hinaus beriet er Intellectual Ventures, die IP- und Venture-Capital-Gesellschaft in Seattle."
      - "2020 gründete er gemeinsam mit Partnern Hyfe, ein KI-Health-Tech-Unternehmen, das Husten zum digitalen Biomarker macht, und hat es seither erfolgreich skaliert. Hyfe ist Weltmarktführer im Husten-Monitoring und kam bereits in 52+ klinischen Studien zum Einsatz, darunter Pharma-Studien der Phasen 2 und 3."
      - "Der ausgebildete Menschenrechtsjurist lebt in Wien."

