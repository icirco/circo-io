bio:
  # First sentence, always visible
  first:
    en: "Julian Circo has spent his career at the intersection of social impact, entrepreneurship and technology."
    de: "Julian Circo bewegt sich seit jeher an der Schnittstelle von sozialer Wirkung, Unternehmertum und Technologie."
  # Paragraphs shown after clicking "Expand"
  rest:
    en:
      - "In 2020 he co-founded Hyfe, an AI health tech company that turns cough into a digital biomarker, and has since taken it to scale. Hyfe is the global market leader in cough monitoring and has been used in 52+ clinical trials, including Phase 2 and 3 pharma trials."
      - "Among others, he co-founded Proof of Impact, a platform for verifying and financing impact at scale, and Triggerise, a global social enterprise connecting people in underserved markets with health products and services. He has advised Intellectual Ventures, the Seattle-based IP and venture capital firm, and remains actively involved with several impact-minded ventures, either as co-founder, adviser, investor or board member."
      - "In previous lives, he led unique, action-packed operations in some of the world’s most challenging environments. These included dozens of humanitarian missions as well as building & running country operations for global organizations in places such as Somalia or Mozambique."
      - "A human rights lawyer by training, he is based in Vienna."
    de:
      - "2020 gründete er gemeinsam mit Partnern Hyfe, ein KI-Health-Tech-Unternehmen, das Husten zum digitalen Biomarker macht, und hat es seither erfolgreich skaliert. Hyfe ist Weltmarktführer im Husten-Monitoring und kam bereits in 52+ klinischen Studien zum Einsatz, darunter Pharma-Studien der Phasen 2 und 3."
      - "Unter anderem war er Mitgründer von Proof of Impact, einer Plattform zur Verifizierung und Finanzierung von Wirkung im großen Maßstab, und von Triggerise, einem globalen Sozialunternehmen, das Menschen in unterversorgten Märkten Zugang zu Gesundheitsprodukten und -leistungen verschafft. Er beriet Intellectual Ventures, die IP- und Venture-Capital-Gesellschaft in Seattle, und ist weiterhin bei mehreren wirkungsorientierten Ventures aktiv: als Mitgründer, Berater, Investor oder Board-Mitglied."
      - "In früheren Lebensabschnitten leitete er außergewöhnliche, intensive Einsätze in einigen der schwierigsten Umfelder der Welt. Dazu zählten Dutzende humanitäre Missionen sowie Aufbau und Leitung von Länderprogrammen globaler Organisationen, etwa in Somalia oder Mosambik."
      - "Der ausgebildete Menschenrechtsjurist lebt in Wien."

