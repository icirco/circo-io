    *, *::before, *::after { box-sizing: border-box; }
    html { background: var(--bg); color-scheme: dark; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);

      text-rendering: optimizeLegibility;

    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 2px solid var(--life-ink); outline-offset: 4px; border-radius: 2px; }

    /* Background photo, fading into the page on the left */
    .bg { position: absolute; inset: 0 0 0 auto; width: 60%; height: 100%; z-index: 0; pointer-events: none; }
    .bg img {
      width: 100%; height: 100%; display: block;
      object-fit: cover; object-position: 66% 50%;
      filter: brightness(.82) contrast(1.05);
      -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 38%);
              mask-image: linear-gradient(to right, transparent 0%, #000 38%);
    }

    main {
      position: relative; z-index: 1;
      padding-inline: var(--pad);
      flex: 1;
      width: 100%; max-width: min(640px, 54vw);
      display: flex; flex-direction: column; justify-content: center;
      gap: 40px;
      padding-block: 64px;
    }
    h1 { margin: 0; font-size: 22px; font-weight: 500; letter-spacing: -.01em; }

    .groups { display: flex; flex-direction: column; gap: 16px; }

    /* Work and Life each get a faint tinted band that fades out toward the photo */
    .group {
      --tone: var(--work); --ink-hover: var(--work-ink); --label: var(--work-label);
      margin-left: calc(-1 * var(--pad));
      padding: 22px 24px 22px var(--pad);
      border-radius: 0 14px 14px 0;
      background: linear-gradient(90deg, rgb(var(--tone) / .09), rgb(var(--tone) / 0) 92%);
    }
    .group.life { --tone: var(--life); --ink-hover: var(--life-ink); --label: var(--life-label); }

    h2 {
      margin: 0 0 8px;
      font-family: var(--mono); font-weight: 400; font-size: 12px;
      letter-spacing: .1em; text-transform: uppercase; color: var(--label);
    }
    ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
    .link {
      display: flex; align-items: center; gap: 16px;
      min-height: 44px; padding-block: 4px;
      transition: color .2s ease;
    }
    .link .txt { display: flex; align-items: baseline; flex-wrap: wrap; column-gap: 16px; row-gap: 2px; }
    .link .name { font-size: clamp(26px, 2.6vw, 34px); font-weight: 500; letter-spacing: -.03em; line-height: 1.1; }
    .link .what { font-size: 14px; color: var(--faint); }
    .link svg { margin-left: auto; flex: none; color: #6F6C66; transition: transform .25s ease, color .25s ease; }
    .link:hover, .link:focus-visible { color: var(--ink-hover); }
    .link:hover svg, .link:focus-visible svg { color: var(--ink-hover); transform: translate(4px, -4px); }

    @media (max-width: 760px) {
      .bg { inset: 0 0 auto 0; width: 100%; height: 62svh; }
      .bg img {
        object-position: 66% 42%;
        -webkit-mask-image: linear-gradient(to bottom, #000 45%, transparent 100%);

      }
      main { max-width: none; padding-top: 44svh; padding-bottom: 40px; gap: 24px; }
      .group { padding-block: 16px; }
      .groups { gap: 12px; }
      ul { gap: 0; }
      .link .txt { flex-direction: column; align-items: flex-start; }
    }
    @media (prefers-reduced-motion: reduce) {
